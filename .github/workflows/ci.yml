name: Build

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Build launcher
        run: dotnet build Nexpert.slnx --configuration Release
      - name: Check Rust formatting
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check
      - name: Test Rust client
        run: cargo test --manifest-path engine/Cargo.toml
      - name: Build Rust client
        run: cargo build --release --manifest-path engine/Cargo.toml
